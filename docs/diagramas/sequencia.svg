<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680"><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#244e3e} .label{font-size:18px} .small{font-size:15px} .title{font-size:22px;font-weight:600} .box{fill:#f1f5ec;stroke:#9eb394;stroke-width:2} .line{stroke:#83977a;stroke-width:2;fill:none}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#83977a"/></marker></defs><rect x="12" y="20" width="156" height="55" rx="10" class="box"/><text x="90.0" y="48" class="title" text-anchor="middle">Motorista</text><path d="M90,75 V620" stroke="#bdcbb3" stroke-width="2" stroke-dasharray="7 6"/><rect x="207" y="20" width="156" height="55" rx="10" class="box"/><text x="285.0" y="48" class="title" text-anchor="middle">Next.js</text><path d="M285,75 V620" stroke="#bdcbb3" stroke-width="2" stroke-dasharray="7 6"/><rect x="417" y="20" width="156" height="55" rx="10" class="box"/><text x="495.0" y="48" class="title" text-anchor="middle">NestJS</text><path d="M495,75 V620" stroke="#bdcbb3" stroke-width="2" stroke-dasharray="7 6"/><rect x="637" y="20" width="156" height="55" rx="10" class="box"/><text x="715.0" y="48" class="title" text-anchor="middle">PostgreSQL</text><path d="M715,75 V620" stroke="#bdcbb3" stroke-width="2" stroke-dasharray="7 6"/><rect x="857" y="20" width="156" height="55" rx="10" class="box"/><text x="935.0" y="48" class="title" text-anchor="middle">ERP</text><path d="M935,75 V620" stroke="#bdcbb3" stroke-width="2" stroke-dasharray="7 6"/><path d="M90,110 L285,110" class="line" marker-end="url(#arrow)"/><text x="187.5" y="100" class="small" text-anchor="middle">Entrar e iniciar viagem</text><path d="M285,150 L495,150" class="line" marker-end="url(#arrow)"/><text x="390.0" y="140" class="small" text-anchor="middle">Cookie + dados validados</text><path d="M495,190 L715,190" class="line" marker-end="url(#arrow)"/><text x="605.0" y="180" class="small" text-anchor="middle">Validar / bloquear recursos</text><path d="M715,230 L495,230" class="line" marker-end="url(#arrow)"/><text x="605.0" y="220" class="small" text-anchor="middle">Confirmar início</text><path d="M495,270 L285,270" class="line" marker-end="url(#arrow)"/><text x="390.0" y="260" class="small" text-anchor="middle">Resultado da operação</text><path d="M90,310 L285,310" class="line" marker-end="url(#arrow)"/><text x="187.5" y="300" class="small" text-anchor="middle">Concluir entregas e rota</text><path d="M285,350 L495,350" class="line" marker-end="url(#arrow)"/><text x="390.0" y="340" class="small" text-anchor="middle">Requisição autenticada</text><path d="M495,390 L715,390" class="line" marker-end="url(#arrow)"/><text x="605.0" y="380" class="small" text-anchor="middle">Transação: rota + evento</text><path d="M715,430 L495,430" class="line" marker-end="url(#arrow)"/><text x="605.0" y="420" class="small" text-anchor="middle">Confirmação persistida</text><path d="M495,470 L285,470" class="line" marker-end="url(#arrow)"/><text x="390.0" y="460" class="small" text-anchor="middle">Viagem concluída</text><path d="M495,510 L935,510" class="line" marker-end="url(#arrow)"/><text x="715.0" y="500" class="small" text-anchor="middle">Evento com ID estável</text><path d="M935,550 L495,550" class="line" marker-end="url(#arrow)"/><text x="715.0" y="540" class="small" text-anchor="middle">Aceite ou falha / reenvio</text><text x="510" y="650" class="small" text-anchor="middle">Falha do ERP não desfaz a conclusão local; reenvio não duplica o evento.</text></svg>