name: frotalab
services:
  database:
    image: postgres:17-alpine
    ports: ["127.0.0.1:54320:5432"]
    environment:
      POSTGRES_DB: frotalab
      POSTGRES_USER: frotalab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-frotalab_local}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frotalab -d frotalab"]
      interval: 3s
      retries: 20
volumes:
  postgres-data:
